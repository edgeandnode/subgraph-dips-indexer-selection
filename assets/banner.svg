<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Comic: a crowd of indexers volunteer for a deployment, the IISA terminal scores every candidate, and the top three take the podium while the potato scores 0.07">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120E2E"/>
      <stop offset="52%" stop-color="#3A22A6"/>
      <stop offset="100%" stop-color="#6747ED"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="190" rx="16"/></clipPath>
    <clipPath id="panel3"><rect x="810" y="16" width="360" height="158" rx="12"/></clipPath>
    <!-- a friendly indexer bot: antenna, screen face, sturdy legs -->
    <g id="bot">
      <line x1="0" y1="-26" x2="0" y2="-33" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
      <circle cx="0" cy="-36" r="2.6" fill="#FFD98A" fill-opacity="0.95"/>
      <rect x="-14" y="-26" width="28" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.93"/>
      <circle cx="-5" cy="-16" r="2" fill="#3A22A6"/>
      <circle cx="5" cy="-16" r="2" fill="#3A22A6"/>
      <path d="M-5,-10 Q0,-6 5,-10" fill="none" stroke="#3A22A6" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="-8" y="-3" width="16" height="7" rx="2" fill="#3A22A6" fill-opacity="0.3"/>
      <line x1="-6" y1="8" x2="-6" y2="15" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="6" y1="8" x2="6" y2="15" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="190" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#frame)">

    <!-- ======================= panel 1: everyone volunteers ======================= -->
    <rect x="30" y="16" width="360" height="158" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.3"/>
    <g>
      <!-- the deployment manifest, up on a little stand -->
      <rect x="66" y="86" width="64" height="8" rx="3" fill="#FFFFFF" fill-opacity="0.25"/>
      <rect x="72" y="38" width="52" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.92"/>
      <g stroke="#3A22A6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75">
        <line x1="80" y1="50" x2="116" y2="50"/>
        <line x1="80" y1="60" x2="110" y2="60"/>
        <line x1="80" y1="70" x2="114" y2="70"/>
      </g>
      <text x="98" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#B7A6FF" fill-opacity="0.9">Qmf00…9aa</text>
      <text x="98" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#FFFFFF" fill-opacity="0.7">needs 3</text>

      <!-- the candidates, hands up -->
      <g transform="translate(190,112) scale(0.9)">
        <line x1="13" y1="-8" x2="23" y2="-22" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="24" cy="-24" r="3" fill="#FFFFFF" fill-opacity="0.95"/>
        <use href="#bot"/>
      </g>
      <g transform="translate(238,118) scale(0.8) rotate(-4)">
        <line x1="13" y1="-8" x2="24" y2="-20" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="25" cy="-22" r="3" fill="#FFFFFF" fill-opacity="0.95"/>
        <use href="#bot"/>
      </g>
      <g transform="translate(284,110) scale(0.95) rotate(3)">
        <line x1="13" y1="-8" x2="22" y2="-23" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="23" cy="-25" r="3" fill="#FFFFFF" fill-opacity="0.95"/>
        <use href="#bot"/>
      </g>
      <g transform="translate(334,118) scale(0.8) rotate(-3)">
        <line x1="13" y1="-8" x2="24" y2="-20" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="25" cy="-22" r="3" fill="#FFFFFF" fill-opacity="0.95"/>
        <use href="#bot"/>
      </g>
      <!-- the potato volunteers too -->
      <g transform="translate(360,146) rotate(8) scale(0.7)">
        <path d="M-30,2 C-32,-12 -14,-22 2,-20 C20,-19 32,-8 29,6 C26,18 8,24 -8,21 C-22,19 -28,12 -30,2 Z" fill="#C79A5B" stroke="#7A5A33" stroke-width="2"/>
        <ellipse cx="-12" cy="-8" rx="2.6" ry="1.8" fill="#8F6A3D" fill-opacity="0.6"/>
        <ellipse cx="14" cy="6" rx="2.4" ry="1.7" fill="#8F6A3D" fill-opacity="0.6"/>
        <circle cx="-8" cy="-4" r="1.9" fill="#3A2A15"/>
        <circle cx="4" cy="-4" r="1.9" fill="#3A2A15"/>
        <path d="M-4,7 Q0,10 4,7" fill="none" stroke="#3A2A15" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <text x="210" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFFFFF" fill-opacity="0.5">a deployment needs three indexers</text>
    </g>

    <!-- ======================= panel 2: the algorithm scores everyone ======================= -->
    <rect x="420" y="16" width="360" height="158" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.3"/>
    <g>
      <!-- the IISA console -->
      <rect x="442" y="34" width="280" height="106" rx="10" fill="#0B0725" fill-opacity="0.92" stroke="#B7A6FF" stroke-opacity="0.4" stroke-width="1.4"/>
      <line x1="442" y1="58" x2="722" y2="58" stroke="#B7A6FF" stroke-opacity="0.25" stroke-width="1.2"/>
      <circle cx="459" cy="46" r="3.8" fill="#FFFFFF" fill-opacity="0.22"/>
      <circle cx="473" cy="46" r="3.8" fill="#FFFFFF" fill-opacity="0.22"/>
      <circle cx="487" cy="46" r="3.8" fill="#FFFFFF" fill-opacity="0.22"/>
      <text x="710" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#B7A6FF" fill-opacity="0.55">iisa@selector:~</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#CFC5FF" fill-opacity="0.85">
        <text x="458" y="76">$ iisa select Qmf00…9aa -n 3</text>
        <text x="458" y="94">scoring 138 candidates…</text>
        <text x="458" y="112">0x7de1… 0.91   0x94c2… 0.88</text>
        <text x="458" y="130">0x1fa8… 0.85   <tspan fill="#FFB86B" font-weight="bold">potato… 0.07</tspan><tspan fill="#CFC5FF" fill-opacity="0.5"> ▌</tspan></text>
      </g>
      <!-- the potato, checking the leaderboard -->
      <g transform="translate(754,120) rotate(6) scale(0.85)">
        <path d="M-30,2 C-32,-12 -14,-22 2,-20 C20,-19 32,-8 29,6 C26,18 8,24 -8,21 C-22,19 -28,12 -30,2 Z" fill="#C79A5B" stroke="#7A5A33" stroke-width="2"/>
        <ellipse cx="-12" cy="-8" rx="2.6" ry="1.8" fill="#8F6A3D" fill-opacity="0.6"/>
        <ellipse cx="14" cy="6" rx="2.4" ry="1.7" fill="#8F6A3D" fill-opacity="0.6"/>
        <circle cx="-8" cy="-4" r="1.9" fill="#3A2A15"/>
        <circle cx="4" cy="-4" r="1.9" fill="#3A2A15"/>
        <ellipse cx="-2" cy="7" rx="3" ry="3.8" fill="none" stroke="#3A2A15" stroke-width="1.6"/>
        <path d="M20,-16 q3,-5 0,-8 q-3,3 0,8" fill="#9FD0FF" fill-opacity="0.9"/>
      </g>
      <text x="600" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFFFFF" fill-opacity="0.5">every candidate scored, five signals each</text>
    </g>

    <!-- ======================= panel 3: the podium ======================= -->
    <rect x="810" y="16" width="360" height="158" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.3"/>
    <g clip-path="url(#panel3)">
      <!-- constellation over the winners -->
      <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.1">
        <line x1="920" y1="38" x2="972" y2="28"/>
        <line x1="972" y1="28" x2="1030" y2="42"/>
      </g>
      <circle cx="920" cy="38" r="6" fill="#FFFFFF" fill-opacity="0.09"/><circle cx="920" cy="38" r="2.8" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="972" cy="28" r="6" fill="#FFFFFF" fill-opacity="0.09"/><circle cx="972" cy="28" r="2.8" fill="#FFFFFF" fill-opacity="0.95"/>
      <circle cx="1030" cy="42" r="6" fill="#FFFFFF" fill-opacity="0.09"/><circle cx="1030" cy="42" r="2.8" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M1146,30 L1147.4,34 L1151,35.4 L1147.4,36.8 L1146,41 L1144.6,36.8 L1141,35.4 L1144.6,34 Z" fill="#FFD98A" fill-opacity="0.9"/>
      <g fill="#FFFFFF">
        <circle cx="1090" cy="60" r="1.1" fill-opacity="0.3"/>
        <circle cx="856" cy="40" r="1.0" fill-opacity="0.25"/>
        <circle cx="1122" cy="92" r="1.1" fill-opacity="0.25"/>
      </g>

      <!-- the podium -->
      <rect x="940" y="106" width="60" height="34" rx="3" fill="#FFFFFF" fill-opacity="0.28"/>
      <rect x="876" y="116" width="60" height="24" rx="3" fill="#FFFFFF" fill-opacity="0.2"/>
      <rect x="1004" y="124" width="60" height="16" rx="3" fill="#FFFFFF" fill-opacity="0.14"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">
        <text x="970" y="128">1</text>
        <text x="906" y="132">2</text>
        <text x="1034" y="135">3</text>
      </g>

      <!-- the winners, each holding a signed agreement -->
      <g transform="translate(970,91) scale(0.85)">
        <use href="#bot"/>
        <rect x="14" y="-10" width="15" height="11" rx="2" fill="#FFD98A" fill-opacity="0.95"/>
        <line x1="17" y1="-6" x2="26" y2="-6" stroke="#7A5A33" stroke-width="1.4"/>
        <line x1="17" y1="-2.5" x2="24" y2="-2.5" stroke="#7A5A33" stroke-width="1.4"/>
      </g>
      <g transform="translate(906,102) scale(0.78)">
        <use href="#bot"/>
        <rect x="14" y="-10" width="15" height="11" rx="2" fill="#FFD98A" fill-opacity="0.95"/>
        <line x1="17" y1="-6" x2="26" y2="-6" stroke="#7A5A33" stroke-width="1.4"/>
        <line x1="17" y1="-2.5" x2="24" y2="-2.5" stroke="#7A5A33" stroke-width="1.4"/>
      </g>
      <g transform="translate(1034,111) scale(0.72)">
        <use href="#bot"/>
        <rect x="14" y="-10" width="15" height="11" rx="2" fill="#FFD98A" fill-opacity="0.95"/>
        <line x1="17" y1="-6" x2="26" y2="-6" stroke="#7A5A33" stroke-width="1.4"/>
        <line x1="17" y1="-2.5" x2="24" y2="-2.5" stroke="#7A5A33" stroke-width="1.4"/>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#B7A6FF" fill-opacity="0.85" text-anchor="middle">
        <text x="970" y="50">0.91</text>
        <text x="906" y="64">0.88</text>
        <text x="1034" y="74">0.85</text>
      </g>

      <!-- the potato, off the podium again -->
      <g transform="translate(856,128) rotate(-5) scale(0.7)">
        <path d="M-30,2 C-32,-12 -14,-22 2,-20 C20,-19 32,-8 29,6 C26,18 8,24 -8,21 C-22,19 -28,12 -30,2 Z" fill="#C79A5B" stroke="#7A5A33" stroke-width="2"/>
        <ellipse cx="-12" cy="-8" rx="2.6" ry="1.8" fill="#8F6A3D" fill-opacity="0.6"/>
        <ellipse cx="14" cy="6" rx="2.4" ry="1.7" fill="#8F6A3D" fill-opacity="0.6"/>
        <path d="M-11,-6 Q-8,-3 -5,-6" fill="none" stroke="#3A2A15" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M1,-6 Q4,-3 7,-6" fill="none" stroke="#3A2A15" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M-4,9 Q0,6 4,9" fill="none" stroke="#3A2A15" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M20,-16 q3,-5 0,-8 q-3,3 0,8" fill="#9FD0FF" fill-opacity="0.9"/>
      </g>

      <!-- verdict labels -->
      <text x="826" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFB86B" fill-opacity="0.8">not this time</text>
      <text x="1154" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFFFFF" fill-opacity="0.6">selected</text>
    </g>
  </g>
</svg>
